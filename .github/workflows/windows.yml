name: Build Windows Release

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up MSVC Environment
      uses: ilammy/msvc-dev-cmd@v1

    - name: Set up Ninja
      uses: seanmiddleditch/gha-setup-ninja@v5

    - name: Install Qt 6.7.3 & Dependencies
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.7.3'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'
        modules: 'qtwebengine qtwebchannel qtpositioning'
        cache: true

    - name: Configure CMake
      run: |
        cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${env:QT_ROOT_DIR}"

    - name: Compile ZeroState
      run: |
        cmake --build build --config Release

    - name: Package Windows Dependencies
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path dist
        if (Test-Path "build\ZeroState.exe") {
            Copy-Item "build\ZeroState.exe" -Destination "dist\ZeroState.exe"
        } elseif (Test-Path "build\Release\ZeroState.exe") {
            Copy-Item "build\Release\ZeroState.exe" -Destination "dist\ZeroState.exe"
        }
        & "${env:QT_ROOT_DIR}\bin\windeployqt.exe" --release dist\ZeroState.exe

    - name: Build Windows Installer (Inno Setup)
      shell: pwsh
      run: |
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ZeroState-Installer
        path: ZeroState-Setup-x64.exe

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: ZeroState-Setup-x64.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
